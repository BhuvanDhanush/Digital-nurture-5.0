<div
  [ngClass]="cardClasses"
  [class.card--enrolled]="(enrolledIds$ | async)?.includes(course.id)"
  [ngStyle]="{
    'border-left-color':
      course.gradeStatus === 'passed'
        ? 'green'
        : course.gradeStatus === 'failed'
        ? 'red'
        : 'gray'
  }"
>

  <h3>{{ course.name }}</h3>

  <p>Code: {{ course.code }}</p>

  <p>{{ course.credits | creditLabel }}</p>

  <div [ngSwitch]="course.gradeStatus">
    <span *ngSwitchCase="'passed'">Passed</span>
    <span *ngSwitchCase="'failed'">Failed</span>
    <span *ngSwitchDefault>Pending</span>
  </div>

  <button (click)="toggleEnrollment()">
    {{ (enrolledIds$ | async)?.includes(course.id)
        ? 'Unenroll'
        : 'Enroll' }}
  </button>

  <button (click)="toggleDetails()">
    {{ isExpanded ? 'Hide Details' : 'Show Details' }}
  </button>

</div>
