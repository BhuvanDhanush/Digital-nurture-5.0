<div *ngIf="course; else notFound">

    <h2>{{ course.name }}</h2>

    <p>
        <strong>Course ID:</strong>
        {{ course.id }}
    </p>

    <p>
        <strong>Course Code:</strong>
        {{ course.code }}
    </p>

    <p>
        <strong>Credits:</strong>
        {{ course.credits }}
    </p>

    <p>
        <strong>Status:</strong>
        {{ course.gradeStatus }}
    </p>

    <br>

    <a routerLink="/courses">
        ← Back to Courses
    </a>

</div>

<ng-template #notFound>

    <h2>Course not found</h2>

    <a routerLink="/courses">
        Back
    </a>

</ng-template>
